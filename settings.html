<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الإعدادات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚙️ الإعدادات</h1>

  <!-- نموذج إدخال البيانات -->
  <div class="form-section">
    <form onsubmit="saveSettings(event)">
      <label>اسم المعلم: <input id="teacherName"></label>
      <label>اسم المدرسة: <input id="schoolName"></label>
      <label>مفتاح API (Google AI Studio): 
        <input id="apiKey" placeholder="أدخل مفتاح Gemini API هنا">
      </label>
      <button type="submit">💾 حفظ</button>
    </form>
  </div>

  <!-- رسالة حالة المفتاح -->
  <div id="statusMessage" style="margin-top:20px; font-weight:bold; color:#4b2e83;">
    🔍 جاري التحقق من حالة المفتاح...
  </div>

  <script>
    async function saveSettings(e) {
      e.preventDefault();
      const apiKey = document.getElementById("apiKey").value;

      if (!apiKey) {
        alert("⚠️ أدخل مفتاح API أولاً");
        return;
      }

      // تجربة طلب للتحقق من المفتاح
      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "اختبار المفتاح" }] }]
          })
        });

        if (!response.ok) {
          throw new Error("المفتاح غير صالح أو انتهت صلاحيته");
        }

        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          // حفظ البيانات إذا المفتاح صالح
          localStorage.setItem("teacherName", document.getElementById("teacherName").value);
          localStorage.setItem("schoolName", document.getElementById("schoolName").value);
          localStorage.setItem("apiKey", apiKey);
          document.getElementById("statusMessage").textContent = "✅ المفتاح صالح وتم حفظ الإعدادات بنجاح!";
          document.getElementById("statusMessage").style.color = "green";
        } else {
          document.getElementById("statusMessage").textContent = "⚠️ المفتاح غير صالح أو لم يرجع نتيجة";
          document.getElementById("statusMessage").style.color = "red";
        }
      } catch (error) {
        document.getElementById("statusMessage").textContent = "❌ خطأ: " + error.message;
        document.getElementById("statusMessage").style.color = "red";
      }
    }

    // عند فتح الصفحة، نعرض القيم المحفوظة سابقًا
    window.onload = () => {
      document.getElementById("teacherName").value = localStorage.getItem("teacherName") || "";
      document.getElementById("schoolName").value = localStorage.getItem("schoolName") || "";
      document.getElementById("apiKey").value = localStorage.getItem("apiKey") || "";

      // عرض حالة المفتاح مباشرة عند فتح الصفحة
      const apiKey = localStorage.getItem("apiKey");
      if (apiKey) {
        document.getElementById("statusMessage").textContent = "🔑 مفتاح API محفوظ، جاري التحقق...";
        saveSettings(new Event("submit")); // تحقق تلقائي
      } else {
        document.getElementById("statusMessage").textContent = "⚠️ لم يتم إدخال مفتاح API بعد";
        document.getElementById("statusMessage").style.color = "red";
      }
    };
  </script>
</body>
</html>
