<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚙️ الإعدادات</h1>
    <p>قم بضبط إعدادات الحساب ومفتاح الذكاء الاصطناعي</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">🏠 الرئيسية</a></li>
      <li><a href="prepare.html">✏️ تحضير جديد</a></li>
      <li><a href="archive.html">📚 المكتبة</a></li>
      <li><a href="settings.html" class="active">⚙️ الإعدادات</a></li>
    </ul>
  </nav>

  <!-- نموذج إدخال البيانات -->
  <div class="form-section card">
    <h2>📋 معلومات المعلم والربط</h2>
    <form onsubmit="saveSettings(event)">
      <label for="teacherName">اسم المعلم:</label>
      <input id="teacherName" placeholder="أدخل اسمك الكريم هنا">

      <label for="schoolName">اسم المدرسة:</label>
      <input id="schoolName" placeholder="أدخل اسم مدرستك هنا">

      <label for="apiKey">مفتاح API (Google AI Studio):</label>
      <div class="input-group">
        <input id="apiKey" type="password" placeholder="أدخل مفتاح Gemini API هنا">
        <button type="button" id="toggleApiKeyBtn" class="secondary-btn" onclick="toggleApiKeyVisibility()">👁️ عرض</button>
      </div>

      <button type="submit" class="primary-btn">💾 حفظ الإعدادات</button>
    </form>

    <!-- رسالة حالة المفتاح -->
    <div id="statusMessage" class="status-box info">
      🔍 جاري التحقق من حالة المفتاح...
    </div>
  </div>

  <footer>
    <p>📌 دفتر التحضير الذكي - جميع الحقوق محفوظة للمعلمين</p>
  </footer>

  <script>
    function toggleApiKeyVisibility() {
      const apiKeyInput = document.getElementById("apiKey");
      const btn = document.getElementById("toggleApiKeyBtn");
      if (apiKeyInput.type === "password") {
        apiKeyInput.type = "text";
        btn.textContent = "🙈 إخفاء";
      } else {
        apiKeyInput.type = "password";
        btn.textContent = "👁️ عرض";
      }
    }

    async function saveSettings(e) {
      if (e) e.preventDefault();
      const apiKey = document.getElementById("apiKey").value.trim();
      const statusMessage = document.getElementById("statusMessage");

      if (!apiKey) {
        statusMessage.textContent = "⚠️ يرجى إدخال مفتاح API أولاً";
        statusMessage.className = "status-box warning";
        return;
      }

      statusMessage.textContent = "⏳ جاري التحقق من صلاحية مفتاح الـ API...";
      statusMessage.className = "status-box info";

      // تجربة طلب للتحقق من المفتاح باستخدام النموذج الحديث gemini-1.5-flash
      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "test key validity" }] }]
          })
        });

        if (!response.ok) {
          const errorDetails = await response.json().catch(() => ({}));
          const errText = errorDetails.error ? errorDetails.error.message : "المفتاح غير صالح أو انتهت صلاحيته";
          throw new Error(errText);
        }

        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          // حفظ البيانات إذا المفتاح صالح
          localStorage.setItem("teacherName", document.getElementById("teacherName").value.trim());
          localStorage.setItem("schoolName", document.getElementById("schoolName").value.trim());
          localStorage.setItem("apiKey", apiKey);
          statusMessage.textContent = "✅ المفتاح صالح وتم حفظ جميع الإعدادات بنجاح!";
          statusMessage.className = "status-box success";
        } else {
          statusMessage.textContent = "⚠️ المفتاح لم يرجع أي نتيجة، يرجى التحقق من صلاحيته.";
          statusMessage.className = "status-box warning";
        }
      } catch (error) {
        statusMessage.textContent = "❌ خطأ في التحقق: " + error.message;
        statusMessage.className = "status-box error";
      }
    }

    // عند فتح الصفحة، نعرض القيم المحفوظة سابقًا
    window.onload = () => {
      document.getElementById("teacherName").value = localStorage.getItem("teacherName") || "";
      document.getElementById("schoolName").value = localStorage.getItem("schoolName") || "";
      document.getElementById("apiKey").value = localStorage.getItem("apiKey") || "";

      // عرض حالة المفتاح مباشرة عند فتح الصفحة
      const apiKey = localStorage.getItem("apiKey");
      if (apiKey) {
        document.getElementById("statusMessage").textContent = "🔑 مفتاح API محفوظ، جاري التحقق...";
        document.getElementById("statusMessage").className = "status-box info";
        saveSettings(); // تحقق تلقائي بدون تمرير حدث لئلا يسبب أخطاء
      } else {
        document.getElementById("statusMessage").textContent = "⚠️ لم يتم إدخال مفتاح API بعد";
        document.getElementById("statusMessage").className = "status-box warning";
      }
    };
  </script>
</body>
</html>
