<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحضير درس جديد</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>✏️ تحضير درس جديد</h1>

  <div class="form-section">
    <form id="lessonForm">
      <label>الصف: <input name="grade"></label>
      <label>المادة: <input name="subject"></label>
      <label>عنوان الدرس: <input name="topic"></label>
      <label>التاريخ: <input name="date" type="date"></label>
      <button type="submit">توليد خطة بالذكاء الاصطناعي (Gemini)</button>
    </form>
  </div>

  <div class="lesson" id="lessonResult">
    <p style="text-align:center; color:#888;">سيظهر هنا محتوى الدرس بعد توليده...</p>
  </div>

  <script>
    const form = document.getElementById('lessonForm');
    const resultDiv = document.getElementById('lessonResult');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const apiKey = localStorage.getItem("apiKey"); // المفتاح من صفحة الإعدادات

      if (!apiKey) {
        alert("⚠️ أدخل مفتاح API أولاً من صفحة الإعدادات");
        return;
      }

      const prompt = `أنشئ خطة درس للصف ${data.grade} في مادة ${data.subject} بعنوان "${data.topic}" تشمل الأهداف، دور المعلم والمتعلم، والتقويم.`;

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const result = await response.json();
        const lessonText = result.candidates[0].content.parts[0].text;

        // عرض النتيجة
        resultDiv.innerHTML = `<h3>خطة الدرس:</h3><p>${lessonText}</p>`;

        // حفظ الدرس في الأرشيف
        const archive = JSON.parse(localStorage.getItem("archive") || "[]");
        archive.push({
          date: data.date,
          subject: data.subject,
          topic: data.topic,
          content: lessonText
        });
        localStorage.setItem("archive", JSON.stringify(archive));

        alert("✅ تم حفظ الدرس في الأرشيف بنجاح!");
      } catch (error) {
        alert("❌ حدث خطأ أثناء الاتصال بـ Google Gemini");
        console.error(error);
      }
    });
  </script>
</body>
</html>
