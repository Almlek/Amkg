<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفتر التحضير الذكي 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📖 دفتر التحضير الذكي</h1>
    <p>مرحبًا بك يا معلم! اختر الصفحة التي تريد الدخول إليها:</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html" class="active">🏠 الرئيسية</a></li>
      <li><a href="prepare.html">✏️ تحضير جديد</a></li>
      <li><a href="archive.html">📚 المكتبة</a></li>
      <li><a href="settings.html">⚙️ الإعدادات</a></li>
    </ul>
  </nav>

  <footer>
    <p>📌 <span id="schoolNameDisplay">مدرسة السلام الأساسية</span> - بإشراف المعلم:
      <span id="teacherName"></span>
    </p>
  </footer>

  <script>
    window.onload = () => {
      document.getElementById("teacherName").textContent = localStorage.getItem("teacherName") || "غير محدد";
      const schoolName = localStorage.getItem("schoolName");
      if (schoolName) {
        document.getElementById("schoolNameDisplay").textContent = schoolName;
      }
    };
  </script>
</body>
</html>
